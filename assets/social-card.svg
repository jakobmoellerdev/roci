<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="roci — a Rust OCI registry">
  <title>roci — a fast, minimal OCI registry in Rust</title>
  <defs>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4713B"/>
      <stop offset="1" stop-color="#CE422B"/>
    </linearGradient>
    <linearGradient id="rustDim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CE422B"/>
      <stop offset="1" stop-color="#9E2F1E"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- faint hex watermark, bottom-right -->
  <g opacity="0.06" transform="translate(880 300) scale(4.2)">
    <path d="M50 4 L92 28 V76 L50 100 L8 76 V28 Z"
          fill="none" stroke="#F4713B" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- centered lockup -->
  <g transform="translate(300 210)">
    <!-- mark -->
    <g transform="scale(1.6)">
      <path d="M50 4 L92 28 V76 L50 100 L8 76 V28 Z"
            fill="none" stroke="url(#rust)" stroke-width="6" stroke-linejoin="round"/>
      <g stroke-linejoin="round">
        <rect x="30" y="34" width="40" height="12" rx="3" fill="url(#rust)"/>
        <rect x="30" y="50" width="40" height="12" rx="3" fill="url(#rustDim)"/>
        <rect x="30" y="66" width="40" height="12" rx="3" fill="#AEB9C6"/>
      </g>
    </g>
    <!-- wordmark -->
    <text x="190" y="130"
          font-family="'SF Mono','JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace"
          font-size="120" font-weight="700" letter-spacing="-3">
      <tspan fill="url(#rust)">r</tspan><tspan fill="#C4CDD8">oci</tspan>
    </text>
  </g>

  <!-- tagline -->
  <text x="640" y="470" text-anchor="middle"
        font-family="'SF Mono','JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace"
        font-size="30" font-weight="500" letter-spacing="1" fill="#8A97A6">
    a fast, minimal OCI registry in Rust
  </text>
</svg>

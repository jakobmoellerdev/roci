<svg xmlns="http://www.w3.org/2000/svg" width="400" height="140" viewBox="0 0 400 140" role="img" aria-label="roci">
  <title>roci</title>
  <defs>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4713B"/>
      <stop offset="1" stop-color="#CE422B"/>
    </linearGradient>
    <linearGradient id="rustDim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CE422B"/>
      <stop offset="1" stop-color="#9E2F1E"/>
    </linearGradient>
  </defs>

  <!-- Mark: rounded hexagon holding a centered stack of three OCI layers -->
  <g transform="translate(20 20)">
    <path d="M50 4 L92 28 V76 L50 100 L8 76 V28 Z"
          fill="none" stroke="url(#rust)" stroke-width="6" stroke-linejoin="round"/>
    <g stroke-linejoin="round">
      <rect x="30" y="34" width="40" height="12" rx="3" fill="url(#rust)"/>
      <rect x="30" y="50" width="40" height="12" rx="3" fill="url(#rustDim)"/>
      <rect x="30" y="66" width="40" height="12" rx="3" fill="#5B6875"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="130" y="88"
        font-family="'SF Mono','JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace"
        font-size="72" font-weight="700" letter-spacing="-2">
    <tspan fill="url(#rust)">r</tspan><tspan fill="#5B6875">oci</tspan>
  </text>
</svg>

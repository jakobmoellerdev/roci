{{- /* Dedicated identity with no RBAC anywhere in the chart and no mounted token. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "roci.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roci.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false

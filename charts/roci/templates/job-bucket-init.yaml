{{- if .Values.rustfs.enabled }}
{{- /*
roci creates s3.bucket itself (create_bucket = true in its config): /readyz
stays 503 until the bucket is writable, and helm runs this post-install hook
only after --wait sees roci Ready, so roci cannot depend on the hook.

A new bucket reaches the other RustFS pods asynchronously (a pod can answer
NoSuchBucket to PutObject seconds after creation), and roci sees only the
Service. This hook therefore (idempotently: 200/409) PUTs the bucket, then
writes and deletes a probe object on every pod via the headless Service until
each accepts it, so the install completes only once all pods know the bucket.
Credentials reach curl through a config on stdin, never argv.
*/}}
{{- $fullname := include "roci.fullname" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-bucket-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roci.labels" . | nindent 4 }}
    app.kubernetes.io/component: bucket-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "roci.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bucket-init
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostUsers: {{ .Values.hostUsers }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bucket-init
          image: {{ include "roci.hooksImage" . | quote }}
          imagePullPolicy: {{ .Values.hooks.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.hooks.resources | nindent 12 }}
          env:
            - name: ENDPOINT
              value: {{ include "roci.s3Endpoint" . | quote }}
            - name: BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: REGION
              value: {{ include "roci.s3Region" . | quote }}
            - name: POD_ENDPOINTS
              value: {{ include "roci.rustfsPodEndpoints" . | quote }}
          volumeMounts:
            - name: rustfs-credentials
              mountPath: /etc/rustfs-credentials
              readOnly: true
          command:
            - /bin/sh
            - -ec
            - |
              esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }
              ak="$(cat /etc/rustfs-credentials/access-key)"
              sk="$(cat /etc/rustfs-credentials/secret-key)"
              cfg="user = \"$(esc "$ak"):$(esc "$sk")\""
              # s3 METHOD URL [curl args...]: prints the HTTP status (000 on transport error).
              s3() {
                m="$1"; u="$2"; shift 2
                printf '%s\n' "$cfg" | curl -sS -K - -o /dev/null -w '%{http_code}' -X "$m" \
                  --aws-sigv4 "aws:amz:${REGION}:s3" \
                  -H 'x-amz-content-sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855' \
                  "$@" "$u" || true
              }
              attempt=0
              while :; do
                attempt=$((attempt + 1))
                code="$(s3 PUT "${ENDPOINT}/${BUCKET}")"
                case "$code" in
                  200|409) echo "bucket ${BUCKET} created (HTTP ${code})"; break ;;
                esac
                if [ "$attempt" -ge 60 ]; then
                  echo "creating bucket ${BUCKET} failed: last HTTP ${code}" >&2
                  exit 1
                fi
                sleep 5
              done
              probe=".roci-bucket-init-probe"
              for ep in $POD_ENDPOINTS; do
                attempt=0
                while :; do
                  attempt=$((attempt + 1))
                  code="$(s3 PUT "${ep}/${BUCKET}/${probe}" --data-binary '')"
                  [ "$code" = 200 ] && break
                  if [ "$attempt" -ge 60 ]; then
                    echo "bucket ${BUCKET} not writable via ${ep}: last HTTP ${code}" >&2
                    exit 1
                  fi
                  sleep 1
                done
                code="$(s3 DELETE "${ep}/${BUCKET}/${probe}")"
                case "$code" in
                  204|200) ;;
                  *) echo "deleting probe via ${ep} failed: HTTP ${code}" >&2; exit 1 ;;
                esac
                echo "bucket ${BUCKET} writable via ${ep} (attempt ${attempt})"
              done
              echo "bucket ${BUCKET} ready"
      volumes:
        - name: rustfs-credentials
          secret:
            secretName: {{ include "roci.rustfsSecretName" . }}
            defaultMode: 0440
            items:
              - key: RUSTFS_ACCESS_KEY
                path: access-key
              - key: RUSTFS_SECRET_KEY
                path: secret-key
{{- end }}

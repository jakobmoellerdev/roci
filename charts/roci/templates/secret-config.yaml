{{- /*
roci.toml. A Secret, not a ConfigMap: in S3 mode it carries access_key_id
(object_store's builder reads no environment, so the id must be a literal).
Numbers go through int64/int/float64: Helm values are float64 and toToml would
emit floats that roci's u64 fields reject.
*/}}
{{- $c := .Values.config -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "roci.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roci.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
type: Opaque
stringData:
  roci.toml: |
    [http]
    listen = "0.0.0.0:5000"
    {{- if .Values.tls.existingSecret }}

    [http.tls]
    cert = "/etc/roci/tls/tls.crt"
    key = "/etc/roci/tls/tls.key"
    {{- end }}

    [http.timeouts]
    read_header_secs = {{ int64 $c.http.timeouts.readHeaderSecs }}
    idle_secs = {{ int64 $c.http.timeouts.idleSecs }}

    [http.rate_limit]
    enabled = {{ $c.http.rateLimit.enabled }}
    {{- if $c.http.rateLimit.enabled }}
    default = { rate = {{ int $c.http.rateLimit.default.rate }}, burst = {{ int $c.http.rateLimit.default.burst }} }
    {{- range $m := keys $c.http.rateLimit.perMethod | sortAlpha }}
    {{- $b := get $c.http.rateLimit.perMethod $m }}
    per_method.{{ $m }} = { rate = {{ int $b.rate }}, burst = {{ int $b.burst }} }
    {{- end }}
    {{- end }}

    [storage]
    root = "/var/lib/roci"
    cache_max_bytes = {{ int64 $c.storage.cacheMaxBytes }}
    dedupe = {{ $c.storage.dedupe }}
    commit = {{ $c.storage.commit }}

    [storage.gc]
    enabled = {{ $c.storage.gc.enabled }}
    delay_secs = {{ int64 $c.storage.gc.delaySecs }}
    interval_secs = {{ int64 $c.storage.gc.intervalSecs }}

    [storage.scrub]
    enabled = {{ $c.storage.scrub.enabled }}
    interval_secs = {{ int64 $c.storage.scrub.intervalSecs }}
    max_bytes_per_sec = {{ int64 $c.storage.scrub.maxBytesPerSec }}
    mode = {{ $c.storage.scrub.mode | toJson }}

    [storage.quota]
    max_repo_bytes = {{ int64 $c.storage.quota.maxRepoBytes }}
    max_total_bytes = {{ int64 $c.storage.quota.maxTotalBytes }}
    max_upload_sessions = {{ int64 $c.storage.quota.maxUploadSessions }}

    [storage.metadata]
    engine = {{ $c.storage.metadata.engine | toJson }}
    snapshot = {{ $c.storage.metadata.snapshot }}
    compact_threshold_bytes = {{ int64 $c.storage.metadata.compactThresholdBytes }}
    {{- if .Values.metadataHmac.existingSecret }}
    hmac_key_file = "/etc/roci/metadata/hmac.key"
    {{- end }}
    {{- if .Values.rustfs.enabled }}

    # In-cluster RustFS: plaintext (confined by NetworkPolicy), and every blob
    # is proxied (redirect_min_size = 0) because clients cannot reach the
    # RustFS Service and roci rejects redirects to internal hosts.
    [storage.s3]
    bucket = {{ .Values.s3.bucket | toJson }}
    region = {{ include "roci.s3Region" . | toJson }}
    endpoint = {{ include "roci.s3Endpoint" . | toJson }}
    allow_http = true
    prefix = {{ .Values.s3.prefix | toJson }}
    access_key_id = {{ include "roci.s3AccessKeyId" . | toJson }}
    secret_access_key_file = "/etc/roci/s3/secret-access-key"
    redirect_min_size = 0
    multipart_part_size = {{ int64 .Values.s3.multipartPartSize }}
    multipart_concurrency = {{ int64 .Values.s3.multipartConcurrency }}
    {{- end }}

    [limits]
    max_body = {{ int64 $c.limits.maxBody }}
    max_upload = {{ int64 $c.limits.maxUpload }}
    max_manifest = {{ int64 $c.limits.maxManifest }}
    max_page = {{ int64 $c.limits.maxPage }}

    [delete]
    enabled = {{ $c.delete.enabled }}

    [log]
    level = {{ $c.log.level | toJson }}
    format = {{ $c.log.format | toJson }}

    [telemetry]
    sample_ratio = {{ printf "%f" (float64 $c.telemetry.sampleRatio) }}
    {{- if $c.telemetry.otlp.endpoint }}

    [telemetry.otlp]
    endpoint = {{ $c.telemetry.otlp.endpoint | toJson }}
    protocol = {{ $c.telemetry.otlp.protocol | toJson }}
    {{- end }}

    [telemetry.metrics]
    enabled = {{ $c.telemetry.metrics.enabled }}
    path = {{ $c.telemetry.metrics.path | toJson }}

    [auth]
    realm = {{ .Values.auth.realm | toJson }}
    cache_ttl_secs = {{ int64 .Values.auth.cacheTtlSecs }}
    {{- if .Values.auth.htpasswd.existingSecret }}

    [auth.htpasswd]
    path = "/etc/roci/auth/htpasswd"
    {{- end }}
    {{- with .Values.auth.accessControl }}

    {{- toToml (dict "access_control" .) | nindent 4 }}
    {{- end }}

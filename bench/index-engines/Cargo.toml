[package]
name = "roci-bench-index-engines"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone benchmark — NOT a member of the roci root workspace.
# LMDB's C FFI must never enter the product dependency graph (the product uses
# the `lmdb` feature gate in roci-storage instead).
[workspace]

[dependencies]
heed3 = { version = "0.22", default-features = false }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
redb = "4"
rand = { version = "0.9", features = ["small_rng"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false

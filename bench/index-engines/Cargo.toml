[package]
name = "roci-bench-index-engines"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone benchmark — NOT a member of the roci root workspace.
# heed/LMDB's C FFI must never enter the product dependency graph.
[workspace]

[dependencies]
heed = "0.22"
redb = "4"
rand = { version = "0.9", features = ["small_rng"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false

[package]
name = "roci-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
futures.workspace = true
roci-config.workspace = true
roci-storage.workspace = true
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
bytes.workspace = true
serde_urlencoded = "0.7"
roci-telemetry.workspace = true
bcrypt.workspace = true
base64.workspace = true
ring.workspace = true
x509-parser.workspace = true
sha2.workspace = true
thiserror.workspace = true

# LDAP bind authentication; off unless the `ldap` feature is enabled.
ldap3 = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }

# OTel: traceparent propagation; off in minimal build.
opentelemetry = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
serde_json.workspace = true
http-body-util = "0.1"
roci-storage.workspace = true
roci-config.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing", "trace"] }
opentelemetry = { workspace = true }
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
rcgen.workspace = true
ldap3_proto.workspace = true
toml.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true

[features]
default = []
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]
ldap = ["dep:ldap3", "dep:rustls", "dep:rustls-native-certs"]

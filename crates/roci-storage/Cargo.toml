[package]
name = "roci-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tokio.workspace = true
sha2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
xorf.workspace = true
cuckoofilter.workspace = true
lru.workspace = true
futures.workspace = true
getrandom.workspace = true
rustix.workspace = true
bytes.workspace = true
tokio-util.workspace = true
crc32c.workspace = true
roci-telemetry.workspace = true
roci-config.workspace = true
rkyv.workspace = true
memmap2.workspace = true
hmac.workspace = true
toml.workspace = true
heed = { workspace = true, optional = true }

[features]
default = []
# Embedded LMDB (heed, stable mdb.master) metadata engine
# (`storage.metadata.engine = "lmdb"`). Brings in a C dependency
# (lmdb-master-sys) compiled via `cc`; the musl builder stage and CI
# install musl-tools / musl-dev for this.
lmdb = ["dep:heed"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
filetime = "0.2"

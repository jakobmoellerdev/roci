[package]
name = "roci-storage-s3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
roci-storage.workspace = true
roci-config.workspace = true
roci-telemetry.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures.workspace = true
crc32c.workspace = true
sha2 = "0.10"
hex.workspace = true
getrandom.workspace = true
# `aws-base` + the reqwest transport + `ring` signing, with reqwest on rustls
# but no bundled provider: keeps aws-lc-rs/aws-lc-sys (a C build) out of the
# static release; ring — the rustls provider roci already audits — is
# installed as the process default at `S3Storage::open`.
object_store = { version = "0.14", default-features = false, features = [
    "aws-base",
    "reqwest",
    "ring",
] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls.workspace = true
url = "2"
http = "1"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
roci-core = { workspace = true }
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
axum = { workspace = true }

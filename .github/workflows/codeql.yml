name: codeql

# CodeQL static analysis (SAST) for Rust. Uses build-mode: none — CodeQL
# extracts from source without compiling.

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.*", ".github/workflows/codeql.yml", ".github/codeql/**"]
  pull_request:
    paths: ["crates/**", "Cargo.*", ".github/workflows/codeql.yml", ".github/codeql/**"]
  schedule:
    # Weekly full scan to catch newly published CodeQL queries against unchanged code.
    - cron: "23 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload analysis results to the code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: rust
          build-mode: none
          config-file: ./.github/codeql/config.yml
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:rust"
          # Use all runner cores to speed up analysis.
          threads: 0

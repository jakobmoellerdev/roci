name: container

on:
  push:
    branches: [main]
    # A `v*` release tag publishes the versioned image (`X.Y.Z`, `X.Y`, `latest`).
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Build the image on a native runner per arch and smoke-test the running
  # container there (native, no emulation). On main, also push by digest so the
  # publish job can assemble a multi-arch manifest.
  #
  # Platform selection is static: PRs build only linux/arm64 (native arm64
  # runner) to save time; main builds both amd64 and arm64. The list is chosen
  # inline from the event — no generator job spins up a runner just to emit it.
  build:
    name: build & smoke-test (${{ matrix.plat.arch }})
    strategy:
      fail-fast: false
      matrix:
        plat: ${{ github.event_name == 'pull_request'
          && fromJSON('[{"arch":"arm64","runner":"ubuntu-24.04-arm"}]')
          || fromJSON('[{"arch":"amd64","runner":"ubuntu-latest"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.plat.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI pre-defined annotation keys (created, version, revision, source, …),
      # computed reproducibly from the commit + Cargo.toml by one script.
      - name: OCI metadata
        id: meta
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          {
            echo 'kv<<OCI_META_EOF'
            scripts/oci-meta.sh "$GIT_REF"
            echo 'OCI_META_EOF'
          } >> "$GITHUB_OUTPUT"

      # Load the native-arch image and smoke-test the running container.
      - name: Build image (native ${{ matrix.plat.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.plat.arch }}
          tags: roci:smoke
          labels: ${{ steps.meta.outputs.kv }}
          load: true

      - name: Run container and smoke-test /v2/ + push/pull
        shell: bash
        run: |
          set -euo pipefail
          docker volume create roci-data >/dev/null
          docker run -d --name roci-smoke -p 5000:5000 \
            --read-only -v roci-data:/var/lib/roci roci:smoke
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/v2/)" = "200" ]; then
              break
            fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/v2/)" = "200"
          data="hello-roci-container"
          digest="sha256:$(printf '%s' "$data" | sha256sum | cut -d' ' -f1)"
          up="$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary "$data" \
            "http://127.0.0.1:5000/v2/smoke/repo/blobs/uploads/?digest=$digest")"
          test "$up" = "201"
          pull="$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:5000/v2/smoke/repo/blobs/$digest")"
          test "$pull" = "200"
          echo "container smoke test passed (v2=200, push=201, pull=200)"

      - name: Container logs + cleanup
        if: always()
        shell: bash
        run: |
          docker logs roci-smoke 2>&1 || true
          docker rm -f roci-smoke 2>/dev/null || true
          docker volume rm roci-data 2>/dev/null || true

      # On push (main or a release tag), log in and push this arch by digest for the manifest merge.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image by digest
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.plat.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Image config labels + per-arch manifest annotations.
          labels: ${{ steps.meta.outputs.kv }}
          annotations: ${{ steps.meta.outputs.kv }}
          sbom: true
          provenance: mode=max
      - name: Export digest
        if: github.event_name == 'push'
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.plat.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the multi-arch manifest from the per-arch digests and attest it.
  # Push events only (main or a `v*` tag): main → `:main`; a release tag →
  # `:X.Y.Z`, `:X.Y`, `:latest`. Both also get the immutable `:<sha>`.
  publish:
    name: publish + attest
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI pre-defined annotation keys (created, version, revision, source, …),
      # computed reproducibly from the commit + Cargo.toml by one script.
      - name: OCI metadata
        id: meta
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          {
            echo 'kv<<OCI_META_EOF'
            scripts/oci-meta.sh "$GIT_REF"
            echo 'OCI_META_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        id: manifest
        working-directory: /tmp/digests
        shell: bash
        run: |
          set -euo pipefail
          tags=("${IMAGE}:${GITHUB_SHA}")
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
            tags+=("${IMAGE}:${major}.${minor}.${patch}" "${IMAGE}:${major}.${minor}" "${IMAGE}:latest")
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Pre-release / non-semver tag (e.g. v0.2.0-rc.1): exact tag only, never `latest`.
            tags+=("${IMAGE}:${GITHUB_REF#refs/tags/v}")
          else
            tags+=("${IMAGE}:main")
          fi
          args=()
          for t in "${tags[@]}"; do args+=("-t" "$t"); done
          # Same OCI annotations on the multi-arch index (GHCR reads e.g.
          # description/source/licenses from here for multi-arch packages).
          while IFS= read -r kv; do
            [ -n "$kv" ] && args+=("--annotation" "index:${kv}")
          done <<< "$OCI_META"
          # shellcheck disable=SC2046
          docker buildx imagetools create "${args[@]}" \
            $(for d in *; do echo "${IMAGE}@sha256:${d}"; done)
          digest="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          OCI_META: ${{ steps.meta.outputs.kv }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # Cross-compile the standalone binary for each Linux arch on its native
  # runner and attest it. Containers are Linux-only; versioned Linux + darwin
  # release tarballs are built by `release.yml` on `v*` tags. Same static
  # per-event platform list as `build`.
  binaries:
    name: binary (linux-${{ matrix.plat.arch }})
    strategy:
      fail-fast: false
      matrix:
        plat: ${{ github.event_name == 'pull_request'
          && fromJSON('[{"arch":"arm64","runner":"ubuntu-24.04-arm"}]')
          || fromJSON('[{"arch":"amd64","runner":"ubuntu-latest"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.plat.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve musl target
        id: t
        shell: bash
        run: |
          case "${{ matrix.plat.arch }}" in
            amd64) echo "target=x86_64-unknown-linux-musl" >> "$GITHUB_OUTPUT" ;;
            arm64) echo "target=aarch64-unknown-linux-musl" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: ${{ steps.t.outputs.target }}
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        env:
          TARGET: ${{ steps.t.outputs.target }}
        run: cargo build --release --target "$TARGET" -p roci-cli --features full
      - name: Package
        shell: bash
        env:
          TARGET: ${{ steps.t.outputs.target }}
        run: |
          mkdir -p dist
          cp "target/${TARGET}/release/roci" "dist/roci-${TARGET}"
      - name: Attest binary provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/roci-${{ steps.t.outputs.target }}
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roci-${{ steps.t.outputs.target }}
          path: dist/roci-${{ steps.t.outputs.target }}
          if-no-files-found: error

name: docs

# Build the VitePress documentation site (docs/) and deploy it to GitHub Pages.
# Pull requests build only (validating the site + dead links); pushes to main
# build and deploy. Least privilege: the build job is read-only; only the
# deploy job holds the Pages write + id-token permissions (it also self-enables
# Pages on first run via configure-pages, so no manual Settings toggle).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

# Default deny; each job grants only what it needs.
permissions: {}

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel an in-flight Pages deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - name: Build site
        # GitHub Pages serves this project site under /roci/; VitePress'
        # config defaults DOCS_BASE to /roci/, matching the repo name, so the
        # build needs no Pages configuration (and stays token-free).
        run: npm run docs:build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: deploy
    # Deploy only from a push/dispatch on main itself — never a PR, and never a
    # manual dispatch on some other branch (which would publish that branch to
    # the live site). PRs stop after a successful build.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        # enablement: true self-provisions Pages (build type = GitHub Actions)
        # on first run, so the deploy never depends on a manual Settings toggle.
        # Lives here (not build) so only this privileged job holds pages: write.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

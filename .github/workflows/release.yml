name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Build release binaries on native runners per target. Linux uses static musl
  # (same as Containerfile); macOS uses the native apple-darwin target.
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            os: linux
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            os: macos
          - target: aarch64-apple-darwin
            runner: macos-15
            os: macos
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-${{ matrix.target }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: >-
          cargo build
          --release
          --target ${{ matrix.target }}
          -p roci-cli
          --features full

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          staging="roci-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/roci" "$staging/"
          tar czf "${staging}.tar.gz" "$staging"
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roci-${{ matrix.target }}
          path: |
            roci-${{ matrix.target }}.tar.gz
            roci-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  # Publish: download all build artifacts, attest provenance, upload to GitHub
  # Release. Only this job holds write permissions.
  publish:
    name: publish + attest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: roci-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.tar.gz

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Create the release if it doesn't exist yet (draft, so manual review).
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --draft --generate-notes --title "$TAG"
          # Upload tarballs + checksums.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            artifacts/*.tar.gz artifacts/*.tar.gz.sha256

  # Publish the Helm chart as an OCI artifact, version-locked to the release:
  # tag vX.Y.Z → oci://ghcr.io/<owner>/charts/roci:X.Y.Z with appVersion X.Y.Z
  # (the image container.yml publishes for the same tag), plus a build-provenance
  # attestation pushed next to it. workflow_dispatch without a tag only packages.
  chart:
    name: helm chart (OCI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      # Pinned helm; keep in sync with helm.yml (bump version + sha256 together).
      HELM_VERSION: 4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb # helm-v4.3.0-linux-amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned helm
        run: |
          curl -sSfL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" -o helm.tgz
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar xzf helm.tgz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm

      - name: Package chart
        id: pkg
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version=""
          if [[ "$GIT_REF" == refs/tags/v* ]]; then version="${GIT_REF#refs/tags/v}"; fi
          pkg="$(bash scripts/helm-package.sh "$RUNNER_TEMP/chart" "$version")"
          test -f "$pkg"
          echo "package=$pkg" >> "$GITHUB_OUTPUT"

      # The docker login is for the attestation push; helm keeps its own credentials.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push chart to GHCR
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PKG: ${{ steps.pkg.outputs.package }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${OWNER,,}/charts"
          printf '%s' "$REGISTRY_PASSWORD" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          out="$(helm push "$PKG" "oci://${repo}" 2>&1)"
          printf '%s\n' "$out"
          digest="$(sed -n 's/^Digest: //p' <<<"$out")"
          [[ "$digest" == sha256:* ]]
          echo "name=${repo}/roci" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          helm registry logout ghcr.io
      - name: Attest chart provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

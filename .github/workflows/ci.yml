name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}

# Least privilege: read-only token by default. Fork PRs (including
# autonomous-agent PRs) run the full gate without a write token or secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel main or merge-queue runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      # Pinned actionlint release + sha256 of the linux_amd64 tarball.
      # Bump both together (checksums.txt on the release page).
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          curl -sSfL "$url" -o "$tarball"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" actionlint
      # Lints every workflow and the composite action; shellcheck runs on run: blocks.
      - name: Run actionlint
        run: ./actionlint -color

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: clippy
          components: clippy
      # Full flavor: lint everything, extensions included.
      - run: cargo clippy --workspace --all-targets --all-features --profile ci -- -D warnings
      # Minimal flavor must also compile clean (ARCHITECTURE.md invariant 1).
      - run: cargo clippy --workspace --no-default-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - uses: taiki-e/install-action@678b06b887cdbf44fa0601e5915f865e17c2241d # v2.44.60
        with:
          tool: nextest
      # nextest is faster and gives better flaky isolation than `cargo test`.
      - run: cargo nextest run --workspace --all-features --profile ci
      # nextest does not run doctests; run them separately.
      - run: cargo test --workspace --all-features --doc

  build-flavors:
    name: build (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [minimal, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: flavor-${{ matrix.flavor }}
      # Minimal: core builds with every extension disabled (invariant 1).
      - if: matrix.flavor == 'minimal'
        run: cargo build --workspace --no-default-features
      - if: matrix.flavor == 'full'
        run: cargo build --workspace --all-features

  minimal-deps-guard:
    name: minimal-deps-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: deps-guard
      # ARCHITECTURE.md invariant 2: no extension crate in the minimal dep graph.
      - name: Assert minimal dependency graph is extension-free
        shell: bash
        run: |
          if cargo tree -p roci-cli --no-default-features --edges normal --prefix none \
             | grep -E 'roci-ext-|roci-cluster'; then
            echo "extension crate leaked into the minimal build (ARCHITECTURE.md invariant 2)"
            exit 1
          fi
          echo "minimal dep graph clean"

  coverage:
    name: coverage (100% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: coverage
          components: llvm-tools-preview
      - uses: taiki-e/install-action@678b06b887cdbf44fa0601e5915f865e17c2241d # v2.44.60
        with:
          tool: cargo-llvm-cov
      # Instrument + run tests once, then emit every report from the same data.
      - name: Coverage gate + reports
        run: |
          cargo llvm-cov --workspace --all-features --no-report
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage-html
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
          # Enforce the 100%-line gate from the same run.
          cargo llvm-cov report --fail-under-lines 100
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            lcov.info
            coverage-html
            coverage-summary.txt
          if-no-files-found: ignore

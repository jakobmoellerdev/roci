name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}

# Least privilege: read-only token by default. Fork PRs (including
# autonomous-agent PRs) run the full gate without a write token or secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel main or merge-queue runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      # Pinned actionlint release + sha256 of the linux_amd64 tarball.
      # Bump both together (checksums.txt on the release page).
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          curl -sSfL "$url" -o "$tarball"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" actionlint
      # Lints every workflow and the composite action; shellcheck runs on run: blocks.
      # `-ignore` the not-yet-recognized `code-quality` permission scope (a
      # recent GitHub addition actionlint 1.7.12 doesn't know yet but is valid).
      - name: Run actionlint
        run: ./actionlint -color -ignore 'unknown permission scope "code-quality"'

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt
      # rustfmt needs no build.
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # shared-key (not the job-scoped `cache-key`) so the conformance job,
          # which has a different job id, restores these same compiled deps.
          shared-key: ci-full
          components: clippy
      # Full flavor: lint everything, extensions included. This is also the
      # workspace's sole full-flavor `--profile ci` compile — its compiled deps
      # are cached under `ci-full` and reused by the conformance job.
      - run: cargo clippy --workspace --all-targets --all-features --profile ci -- -D warnings
      # Minimal flavor: clippy is the ONLY gate that compiles the minimal flavor
      # (ARCHITECTURE.md invariant 1). `--all-targets --no-default-features`
      # type-checks every target, a strict superset of a bare minimal `build`.
      - run: cargo clippy --workspace --no-default-features --profile ci -- -D warnings

  # One instrumented all-features build serves BOTH the test run and the
  # coverage gate — nextest runs under llvm-cov, so we compile once instead of
  # once for tests and again for coverage.
  test-and-coverage:
    name: test + coverage (100% lines)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Report coverage to GitHub's code-coverage API for PR gating
      # ("Restrict code coverage"). Fork PRs lack this and are skipped gracefully.
      code-quality: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test-cov
          components: llvm-tools-preview
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: nextest,cargo-llvm-cov
      - name: Tests + coverage (single instrumented build, 100% gate)
        # scripts/coverage.sh instruments once, runs the suite via nextest, and
        # asserts 100% line coverage (lcov); also emits cobertura.xml.
        run: bash scripts/coverage.sh
      - name: HTML coverage report
        if: always()
        run: cargo llvm-cov report --html --output-dir coverage-html || true
      # Doctests are not instrumented (none exist yet); run them for correctness.
      - name: Doctests
        run: cargo test --workspace --all-features --doc --profile ci
      # Report coverage to GitHub so PRs can be gated on it. Skipped on fork PRs
      # (no write access) — the action exits gracefully there anyway.
      - name: Report coverage to GitHub
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: cobertura.xml
          language: Rust
          label: code-coverage/llvm-cov
          fail-on-error: false
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            lcov.info
            cobertura.xml
            coverage-html
            COVERAGE.md
          if-no-files-found: ignore

  minimal-deps-guard:
    name: minimal-deps-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      # ARCHITECTURE.md invariant 2: no extension crate in the minimal dep graph.
      # `cargo tree` resolves metadata only — no workspace compile needed.
      - name: Assert minimal dependency graph is extension-free
        shell: bash
        run: |
          if cargo tree -p roci-cli --no-default-features --edges normal --prefix none \
             | grep -E 'roci-ext-|roci-cluster'; then
            echo "extension crate leaked into the minimal build (ARCHITECTURE.md invariant 2)"
            exit 1
          fi
          echo "minimal dep graph clean"

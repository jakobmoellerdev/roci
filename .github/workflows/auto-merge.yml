name: auto-merge

# Enables GitHub auto-merge for PRs labeled `automerge` (the label agents
# apply). This does NOT merge directly: `gh pr merge --auto` queues the merge
# for when branch-protection conditions are met — green required checks AND a
# code-owner approval. The label never bypasses review (SECURITY.md policy).
#
# Uses `pull_request` (not `pull_request_target`) and runs no PR code — it only
# calls the GitHub API — so fork PRs cannot obtain a write token via this path.

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

version: 2
updates:
  # Pinned GitHub Actions SHAs — keeps third-party action pins current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # NOTE: a `cargo` ecosystem entry is added here once a Cargo workspace exists
  # (Dependabot errors on a cargo ecosystem with no manifest). Example:
  #   - package-ecosystem: cargo
  #     directory: "/"
  #     schedule: { interval: weekly }
  #     open-pull-requests-limit: 5
  #     cooldown: { default-days: 7 }
# NOTE: Dependabot PRs are NOT auto-labeled `automerge`; they still require a
# code-owner review before merge (SECURITY.md supply-chain policy).

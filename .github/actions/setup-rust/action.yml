# Composite action: install the pinned Rust toolchain and wire up build caching.
#
# The toolchain version is pinned here to match `rust-toolchain.toml`; when you
# bump the toolchain, bump both. dtolnay/rust-toolchain is invoked with an
# explicit channel (not @master file-reading) so the resolved toolchain is
# unambiguous and the cache key is deterministic.
name: Setup Rust
description: Install the pinned Rust toolchain and restore the build cache.

inputs:
  cache-key:
    description: >-
      An ADDITIONAL, job-scoped cache suffix (rust-cache `key`). rust-cache
      always folds the GitHub job id into the key, so two differently-named
      jobs with the same `cache-key` still get SEPARATE caches. Use this for a
      job whose artifacts must not be shared with any other job (e.g. the
      llvm-cov-instrumented test build, or a package-scoped storage build).
    required: false
    default: ""
  shared-key:
    description: >-
      A cache key used INSTEAD of the automatic job-id key (rust-cache
      `shared-key`), stable across differently-named jobs. Jobs that pass the
      same `shared-key` share one cache entry — use this to let a later job
      restore the compiled dependency tree an earlier job already built (e.g.
      clippy and conformance both compile the full flavor at `--profile ci`).
      Set exactly one of `cache-key` / `shared-key`.
    required: false
    default: ""
  components:
    description: Space/comma-separated extra rustup components (e.g. "clippy, rustfmt").
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      # Pinned to the same channel as rust-toolchain.toml. Bump both together.
      uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      with:
        components: ${{ inputs.components }}
    - name: Cache cargo registry and build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # `key` is job-scoped (job id always folded in); `shared-key` replaces
        # the job-id component so same-`shared-key` jobs share one entry.
        key: ${{ inputs.cache-key }}
        shared-key: ${{ inputs.shared-key }}
        cache-on-failure: true
        # Only main writes cache entries; PR jobs restore from main's cache but
        # never save, so a PR can't poison the shared cache.
        save-if: ${{ github.ref == 'refs/heads/main' }}

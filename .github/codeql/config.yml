# CodeQL configuration for roci — tuned for speed.
#
# Scope analysis to the Rust workspace crates only: the OCI spec submodules and
# docs are not our code and analyzing them wastes time. Use the default query
# suite (fast) rather than security-extended.
name: roci-codeql

paths:
  - crates

paths-ignore:
  - spec
  - "**/tests"

# No `queries:` block — omitting it runs CodeQL's default query suite, which is
# the fastest (security-and-quality / security-extended are slower).
#
# roci ships an in-repo path-injection barrier model pack at
# `.github/codeql/extensions/roci-path-sanitizers/` (declaring
# `SafeComponent::new` / `FsStorage::safe_component` as `path-injection`
# barriers). It is NOT wired here yet: `packs:` resolves from GHCR (local
# unpublished pack fails init) and `database init` rejects `--additional-packs`.
# Activating it requires publishing the pack to GHCR (`codeql pack publish`,
# needs `packages: write`) or seeding it into the CLI package cache via a
# pre-init `setup-codeql` + `codeql pack create` step. Until then the generated
# path-injection alerts are dismissed as false positives (the `SafeComponent`
# newtype is the real, human-visible sanitizer boundary).

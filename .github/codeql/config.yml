# CodeQL configuration for roci — tuned for speed.
#
# Scope analysis to the Rust workspace crates only: the OCI spec submodules and
# docs are not our code and analyzing them wastes time. Use the default query
# suite (fast) rather than security-extended.
name: roci-codeql

paths:
  - crates

paths-ignore:
  - spec
  - "**/tests"

# Apply roci's in-repo path-injection barrier model pack (declares
# `SafeComponent::new` / `FsStorage::safe_component` as `path-injection`
# barriers — the durable fix for the recurring false positives; the
# `SafeComponent` newtype is the real sanitizer boundary). The pack lives at
# `.github/codeql/extensions/roci-path-sanitizers/` and is resolved from the
# local checkout via `--additional-packs` (set through
# `CODEQL_ACTION_EXTRA_OPTIONS` in codeql.yml), not from GHCR.
packs:
  - roci/path-sanitizers

# No `queries:` block — omitting it runs CodeQL's default query suite, which is
# the fastest (security-and-quality / security-extended are slower).

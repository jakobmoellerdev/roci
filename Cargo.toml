[workspace]
resolver = "2"
members = [
    "crates/roci-core",
    "crates/roci-storage",
    "crates/roci-config",
    "crates/roci-telemetry",
    "crates/roci-storage-s3",
    "crates/roci-ext-search",
    "crates/roci-ext-sig",
    "crates/roci-ext-scan",
    "crates/roci-ext-sync",
    "crates/roci-cluster",
    "crates/roci-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/jakobmoellerdev/roci"
authors = ["Jakob Möller"]

[workspace.dependencies]
# Internal crates (path + version so cargo-deny's wildcard ban is satisfied).
roci-core = { path = "crates/roci-core", version = "0.1.0" }
roci-storage = { path = "crates/roci-storage", version = "0.1.0" }
roci-config = { path = "crates/roci-config", version = "0.1.0" }
roci-telemetry = { path = "crates/roci-telemetry", version = "0.1.0" }
roci-storage-s3 = { path = "crates/roci-storage-s3", version = "0.1.0" }
roci-ext-search = { path = "crates/roci-ext-search", version = "0.1.0" }
roci-ext-sig = { path = "crates/roci-ext-sig", version = "0.1.0" }
roci-ext-scan = { path = "crates/roci-ext-scan", version = "0.1.0" }
roci-ext-sync = { path = "crates/roci-ext-sync", version = "0.1.0" }
roci-cluster = { path = "crates/roci-cluster", version = "0.1.0" }

# Third-party.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "macros", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = { version = "0.10", features = ["asm"] }  # ARMv8 SHA-2 backend needs `asm` (software otherwise: ~0.55 vs ~2.5 GiB/s)
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.31"
tracing-opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "experimental_metrics_custom_reader"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "internal-logs"] }
opentelemetry-appender-tracing = "0.31"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures = "0.3"
bytes = "1"
tempfile = "3"
xorf = "0.13"
cuckoofilter = "0.5"
lru = "0.18"
getrandom = "0.4"
rustix = { version = "1", features = ["fs"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server", "server-auto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = "0.13"
http-body-util = "0.1"
mimalloc = { version = "0.1", default-features = false }
crc32c = "0.6"
rkyv = "0.8"
memmap2 = "0.9"
hmac = "0.12"
redb = "4"

[profile.ci]
inherits = "dev"
debug = 0
incremental = false
strip = "debuginfo"

[workspace]
resolver = "2"
members = [
    "crates/roci-core",
    "crates/roci-storage",
    "crates/roci-config",
    "crates/roci-telemetry",
    "crates/roci-storage-s3",
    "crates/roci-ext-search",
    "crates/roci-ext-sig",
    "crates/roci-ext-scan",
    "crates/roci-ext-sync",
    "crates/roci-cluster",
    "crates/roci-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/jakobmoellerdev/roci"
authors = ["Jakob Möller"]

[workspace.dependencies]
# Internal crates.
roci-core = { path = "crates/roci-core" }
roci-storage = { path = "crates/roci-storage" }
roci-config = { path = "crates/roci-config" }
roci-telemetry = { path = "crates/roci-telemetry" }
roci-storage-s3 = { path = "crates/roci-storage-s3" }
roci-ext-search = { path = "crates/roci-ext-search" }
roci-ext-sig = { path = "crates/roci-ext-sig" }
roci-ext-scan = { path = "crates/roci-ext-scan" }
roci-ext-sync = { path = "crates/roci-ext-sync" }
roci-cluster = { path = "crates/roci-cluster" }

# Third-party.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "macros", "signal", "sync"] }
axum = "0.8"
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures = "0.3"
bytes = "1"
tempfile = "3"

[profile.ci]
inherits = "dev"
debug = 0
incremental = false
strip = "debuginfo"
